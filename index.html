<!DOCTYPE html>
<!--
  CogniCare - index.html   (Increment 1: Home / "Utama")

  Greeting, today's AI suggestion, the three category cards and the
  bottom tab bar. The text and the suggestion are filled in by js/home.js.
  Only elderly users can open this page (caregivers and admins have
  their own dashboard).

  The old home page (games menu) is saved as legacy/index.old.html

  IDs that js/home.js needs:
  greeting, suggestion-text
-->
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5c6b">
  <title>CogniCare</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <span class="brand">CogniCare</span>
    </div>
  </header>

  <main id="main">

    <div class="hero">
      <h1 id="greeting">&nbsp;</h1>
      <p data-i18n="homeToday">Today's practice: just 5 minutes.</p>
    </div>

    <!-- AI suggestion (always says it is only a suggestion) -->
    <section class="alert alert-info" aria-labelledby="suggestion-title">
      <strong id="suggestion-title" data-i18n="suggestionTitle">Suggestion for you</strong><br>
      <span id="suggestion-text"></span>
    </section>

    <!-- The three categories. Links will point to the games when they are built. -->
    <section class="card" aria-label="CogniCare">
        <a class="cat-card cat-memory" href="pairs.html">
        <span class="cat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </span>
        <span>
          <strong data-i18n="catMemory">Memory</strong>
          <span class="desc" data-i18n="gameCardPairs">Card Pairs</span>
        </span>
      </a>

      <a class="cat-card cat-attention" href="#">
        <span class="cat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
        </span>
        <span>
          <strong data-i18n="catAttention">Attention</strong>
          <span class="desc" data-i18n="gameFindTarget">Find the Target</span>
        </span>
      </a>

      <a class="cat-card cat-speed" href="#">
        <span class="cat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
        </span>
        <span>
          <strong data-i18n="catSpeed">Brain Speed</strong>
          <span class="desc" data-i18n="gameQuickTap">Quick Tap</span>
        </span>
      </a>
    </section>

    <p class="note text-center" data-i18n="disclaimerShort">Suggestions only. Not medical advice and not a diagnosis.</p>

  </main>

  <!-- Bottom tab bar: the same four tabs on every main screen -->
  <nav class="tabbar" data-i18n-aria-label="mainMenu" aria-label="Main menu">
    <ul>
      <li>
        <a class="tab" href="index.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>
          <span data-i18n="home">Home</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
          <span data-i18n="practice">Practice</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
          <span data-i18n="progress">Progress</span>
        </a>
      </li>
      <li>
        <a class="tab" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
          <span data-i18n="settings">Settings</span>
        </a>
      </li>
    </ul>
  </nav>

  <script type="module" src="js/home.js"></script>
</body>
</html>
