<!DOCTYPE html>
<!--
  CogniCare - login.html   (Increment 1 look: css/app.css)
  FR001 (login), FR005 (reset password), FR008 (language), FR025 (senior-friendly)

  All logic is in js/auth.js. The IDs below must stay the same:
  login-form, email, password, show-password, login-btn, form-message,
  forgot-link, reset-section, reset-email, reset-btn, reset-cancel.

  The text inside each tag is only a fallback shown for a split second;
  data-i18n replaces it with the chosen language (see translations.js).
-->
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5c6b">
  <title>CogniCare</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Lets keyboard / screen-reader users jump past the header -->
  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <span class="brand">CogniCare</span>

      <!-- Language can be chosen before logging in (FR008) -->
      <div class="btn-group" role="group" aria-labelledby="lang-label">
        <span id="lang-label" class="sr-only" data-i18n="language">Language</span>
        <button type="button" class="btn filter-btn" data-set-lang="bm" aria-pressed="false">Bahasa Malaysia</button>
        <button type="button" class="btn filter-btn" data-set-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <main id="main">

    <a class="back-link" href="welcome.html">
      <span aria-hidden="true">&larr;</span>
      <span data-i18n="back">Back</span>
    </a>

    <div class="hero">
      <h1 data-i18n="loginTitle">Log In to Your Account</h1>
    </div>

    <section class="card" aria-labelledby="login-heading">
      <h2 id="login-heading" class="sr-only" data-i18n="login">Login</h2>

      <!-- Messages (errors, success) appear here. role="alert" = read aloud by screen readers -->
      <div id="form-message" role="alert" aria-live="assertive" hidden></div>

      <!-- novalidate: auth.js shows its own translated messages -->
      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="email" data-i18n="email">Email</label>
          <input type="email" id="email" name="email"
                 autocomplete="email" inputmode="email"
                 autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="form-group">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" data-password required>
        </div>

        <!-- One big checkbox row to show / hide the password -->
        <label class="choice" for="show-password">
          <input type="checkbox" id="show-password">
          <span data-i18n="showPassword">Show password</span>
        </label>

        <button type="submit" id="login-btn" class="btn" data-i18n="login">Login</button>
      </form>

      <button type="button" id="forgot-link" class="btn btn-link"
              data-i18n="forgotPassword">Forgot your password?</button>
    </section>

    <!-- Reset password (FR005): hidden until "Forgot password?" is pressed -->
    <section id="reset-section" class="panel stack" aria-labelledby="reset-heading" hidden>
      <h2 id="reset-heading" data-i18n="resetPasswordTitle">Reset Password</h2>
      <p data-i18n="resetPasswordText">Enter your email. We will send a link to set a new password.</p>

      <div class="form-group">
        <label for="reset-email" data-i18n="email">Email</label>
        <input type="email" id="reset-email" name="reset-email"
               autocomplete="email" inputmode="email"
               autocapitalize="none" spellcheck="false">
      </div>

      <div class="stack">
        <button type="button" id="reset-btn" class="btn" data-i18n="sendResetLink">Send Link</button>
        <button type="button" id="reset-cancel" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
      </div>
    </section>

    <!-- Link to registration -->
    <section class="card text-center" aria-labelledby="no-account">
      <p id="no-account" data-i18n="noAccountYet">Don't have an account yet?</p>
      <a class="btn btn-secondary" href="register.html" data-i18n="register">Register</a>
    </section>

  </main>

  <footer class="site-footer">
    <p>CogniCare</p>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
