<!DOCTYPE html>
<!--
  CogniCare - register.html   (Increment 1 look: css/app.css)
  FR002 (create account), FR008 (language), FR025 (senior-friendly)

  All logic is in js/auth.js. The IDs / names below must stay the same:
  register-form, name, email, age, password, confirm-password,
  radio buttons name="role", show-password, register-btn, form-message.

  Only "elderly" and "caregiver" can be chosen here. The administrator
  role is NOT offered on purpose (see the security note in auth.js).
-->
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5c6b">
  <title>CogniCare</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <span class="brand">CogniCare</span>

      <!-- Language can be chosen before registering (FR008) -->
      <div class="btn-group" role="group" aria-labelledby="lang-label">
        <span id="lang-label" class="sr-only" data-i18n="language">Language</span>
        <button type="button" class="btn filter-btn" data-set-lang="bm" aria-pressed="false">Bahasa Malaysia</button>
        <button type="button" class="btn filter-btn" data-set-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <main id="main">

    <a class="back-link" href="welcome.html">
      <span aria-hidden="true">&larr;</span>
      <span data-i18n="back">Back</span>
    </a>

    <div class="hero">
      <h1 data-i18n="registerTitle">Create a New Account</h1>
    </div>

    <section class="card" aria-labelledby="register-heading">
      <h2 id="register-heading" class="sr-only" data-i18n="register">Register</h2>

      <!-- Messages (errors, success) appear here -->
      <div id="form-message" role="alert" aria-live="assertive" hidden></div>

      <!-- novalidate: auth.js shows its own translated messages -->
      <form id="register-form" novalidate>

        <!-- Role: two big choices. Admin is intentionally not listed. -->
        <fieldset>
          <legend data-i18n="role">Role</legend>
          <label class="choice" for="role-elderly">
            <input type="radio" id="role-elderly" name="role" value="elderly" checked>
            <span data-i18n="roleElderly">Elderly user</span>
          </label>
          <label class="choice" for="role-caregiver">
            <input type="radio" id="role-caregiver" name="role" value="caregiver">
            <span data-i18n="roleCaregiver">Caregiver</span>
          </label>
        </fieldset>

        <div class="form-group">
          <label for="name" data-i18n="fullName">Full name</label>
          <input type="text" id="name" name="name"
                 autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email" data-i18n="email">Email</label>
          <input type="email" id="email" name="email"
                 autocomplete="email" inputmode="email"
                 autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="form-group">
          <label for="age" data-i18n="age">Age</label>
          <!-- inputmode="numeric" opens the number keypad on phones -->
          <input type="number" id="age" name="age"
                 min="1" max="120" inputmode="numeric" required>
        </div>

        <div class="form-group">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="new-password" data-password required>
          <!-- Simple hint so people know the rule BEFORE they make a mistake -->
          <small class="hint" data-i18n="passwordHint">At least 6 characters.</small>
        </div>

        <div class="form-group">
          <label for="confirm-password" data-i18n="confirmPassword">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password"
                 autocomplete="new-password" data-password required>
        </div>

        <!-- One checkbox shows / hides BOTH password boxes -->
        <label class="choice" for="show-password">
          <input type="checkbox" id="show-password">
          <span data-i18n="showPassword">Show password</span>
        </label>

        <button type="submit" id="register-btn" class="btn" data-i18n="register">Register</button>
      </form>
    </section>

    <!-- Link back to login -->
    <section class="card text-center" aria-labelledby="have-account">
      <p id="have-account" data-i18n="haveAccount">Already have an account?</p>
      <a class="btn btn-secondary" href="login.html" data-i18n="login">Login</a>
    </section>

  </main>

  <footer class="site-footer">
    <p>CogniCare</p>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
